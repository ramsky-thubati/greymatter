services:
  greymatter:
    build: .
    image: greymatter
    container_name: greymatter
    ports:
      - "127.0.0.1:4747:4747"
    volumes:
      - ${GREYMATTER_DATA:-~/.greymatter}:/data
    environment:
      DB_PATH: /data/greymatter.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4747/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
